name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 UV
        run: pip install uv

      - name: 安装项目依赖
        run: |
          uv pip install --system .

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 构建 EXE
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name windows-mcp `
            --add-data "src/windows_mcp;windows_mcp" `
            --add-data "setup_wizard.py;." `
            --hidden-import setup_wizard `
            --hidden-import comtypes `
            --hidden-import comtypes.client `
            --hidden-import comtypes.gen `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import pywintypes `
            --hidden-import pythoncom `
            --hidden-import dxcam `
            --hidden-import fastmcp `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --collect-all comtypes `
            --collect-all pywin32 `
            --collect-all fastmcp `
            --collect-all uuid7 `
            build_exe.py

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-mcp-${{ matrix.python-version }}-win64
          path: dist/windows-mcp.exe

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows-mcp.exe
